schedule_ready:
  target:
    entity:
      integration: clearlight_sauna
      domain: climate
  fields:
    ready_by:
      required: true
      example: "07:00:00"
      selector:
        time:
    temperature:
      required: true
      example: 140
      selector:
        number:
          min: 20
          max: 175
          step: 1
          mode: box
    minutes_at_temperature:
      required: true
      default: 45
      selector:
        number:
          min: 5
          max: 90
          step: 5
          unit_of_measurement: min

cancel_ready:
  target:
    entity:
      integration: clearlight_sauna
      domain: climate

set_heatup_calibration:
  target:
    entity:
      integration: clearlight_sauna
      domain: climate
  fields:
    rise:
      example: 85
      selector:
        number:
          min: 10
          max: 150
          step: 0.1
          mode: box
    time_constant:
      example: 32
      selector:
        number:
          min: 10
          max: 120
          step: 0.5
          unit_of_measurement: min
          mode: box
